name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: VoicemeeterBG
          path: VoicemeeterBG.exe
          if-no-files-found: error
